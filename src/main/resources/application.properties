spring.application.name=food-calc-backend
server.port=${PORT:8080}
spring.threads.virtual.enabled=true

foodcalc.off.base-url=${FOODCALC_OFF_URL:https://world.openfoodfacts.org}
foodcalc.off.user-agent=food-calc-backend/1.0 (https://github.com/RR2000/food-calc-backend)
foodcalc.off.timeout=8s
# read once in the background right after the start, so the first real search finds a warm client; empty = off
foodcalc.off.warm-up-barcode=3017620422003
foodcalc.cache.size=10000
foodcalc.cache.ttl=12h
foodcalc.cors-origins=${FOODCALC_CORS_ORIGINS:http://localhost:8081}

management.endpoints.web.exposure.include=health
